@if (session(); as session) {
  <header class="assurlite-topbar">
    <div class="assurlite-topbar-inner">
      <span class="assurlite-topbar-brand">
        <i class="pi pi-shield" aria-hidden="true"></i>
        AssurLite
      </span>

      <div class="assurlite-topbar-user">
        <span class="assurlite-topbar-email">
          <i class="pi pi-user" aria-hidden="true"></i>
          <span class="assurlite-sr-only">Connecté en tant que</span>
          {{ session.email | masquerEmail }}
        </span>
        <button pButton (click)="deconnecter()" size="small" severity="secondary" outlined>
          <i class="pi pi-sign-out" aria-hidden="true"></i>
          Se déconnecter
        </button>
      </div>
    </div>
  </header>
}

<main>
  <router-outlet />
</main>

<!-- Zone toujours présente : les lecteurs d'écran annoncent ce qui y apparaît -->
<div class="assurlite-notifications" role="status" aria-live="polite">
  @if (notification(); as notification) {
    <div
      class="assurlite-notification"
      [class.assurlite-notification-erreur]="notification.type === 'erreur'"
    >
      <i
        class="pi"
        [class.pi-check-circle]="notification.type === 'info'"
        [class.pi-exclamation-triangle]="notification.type === 'erreur'"
        aria-hidden="true"
      ></i>
      <span class="assurlite-notification-texte">
        @if (notification.type === 'erreur') {
          <span class="assurlite-sr-only">Erreur :</span>
        }
        {{ notification.texte }}
      </span>
      @if (enAttente() > 0) {
        <span class="assurlite-notification-attente">+{{ enAttente() }} en attente</span>
      }
      <button
        type="button"
        class="assurlite-notification-fermer"
        (click)="fermerNotification()"
        aria-label="Fermer la notification"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
