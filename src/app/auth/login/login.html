<div class="assurlite-page">
  <header class="assurlite-header">
    <span class="assurlite-header-icon" aria-hidden="true"><i class="pi pi-shield"></i></span>
    <div>
      <h1>AssurLite</h1>
      <p class="assurlite-subtitle">Connectez-vous à votre espace</p>
    </div>
  </header>

  <p-card>
    <form [formRoot]="formLogin" class="assurlite-form">
      <div class="assurlite-field">
        <label for="email">Email</label>
        <input
          pInputText
          fluid
          id="email"
          type="email"
          autocomplete="email"
          [formField]="formLogin.email"
          [class.p-invalid]="formLogin.email().touched() && formLogin.email().invalid()"
          [attr.aria-invalid]="(formLogin.email().touched() && formLogin.email().invalid()) || null"
        />
        @if (formLogin.email().touched()) {
          @for (e of formLogin.email().errors(); track e.kind) {
            <small class="assurlite-field-error" role="alert">
              <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
              {{ e.message }}
            </small>
          }
        }
      </div>

      <div class="assurlite-field">
        <label for="password">Mot de passe</label>
        <input
          pInputText
          fluid
          id="password"
          type="password"
          autocomplete="current-password"
          [formField]="formLogin.password"
          [class.p-invalid]="formLogin.password().touched() && formLogin.password().invalid()"
          [attr.aria-invalid]="
            (formLogin.password().touched() && formLogin.password().invalid()) || null
          "
        />
        @if (formLogin.password().touched()) {
          @for (e of formLogin.password().errors(); track e.kind) {
            <small class="assurlite-field-error" role="alert">
              <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
              {{ e.message }}
            </small>
          }
        }
      </div>

      <button pButton type="submit" class="assurlite-submit">
        <i class="pi pi-sign-in" aria-hidden="true"></i>
        Se connecter
      </button>
    </form>
  </p-card>
</div>
