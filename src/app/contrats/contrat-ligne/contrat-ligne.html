<td>{{ contrat().type }}</td>
<td>{{ contrat().prime }} €</td>
<td>
  @switch (contrat().statut) {
    @case ('actif') {
      <p-tag value="Actif" severity="success" icon="pi pi-check-circle" />
    }
    @case ('suspendu') {
      <p-tag value="Suspendu" severity="warn" icon="pi pi-pause-circle" />
    }
    @default {
      <p-tag value="Résilié" severity="danger" icon="pi pi-times-circle" />
    }
  }
</td>
<td>
  <button pButton (click)="supLigne()" size="small" severity="danger" text class="assurlite-delete-btn">
    <i class="pi pi-trash" aria-hidden="true"></i>
    Supprimer
  </button>
<a [routerLink]="['/contrats', contrat().id]" pButton size="small" severity="info" text class="assurlite-detail-link">
  Voir détail
</a>
</td>
