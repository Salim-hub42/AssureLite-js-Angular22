<div class="assurlite-page">
  <header class="assurlite-header">
    <span class="assurlite-header-icon" aria-hidden="true"><i class="pi pi-shield"></i></span>
    <div>
      <h1>AssurLite</h1>
      <p class="assurlite-subtitle">Gestion des contrats</p>
    </div>
  </header>

  <p-card>
    <div class="assurlite-filters" role="group" aria-label="Filtrer les contrats par statut">
      <span class="assurlite-filters-label">
        <i class="pi pi-filter" aria-hidden="true"></i>
        Statut
      </span>
      <div class="assurlite-chips">
        @for (statut of statuts; track statut) {
          <label class="assurlite-chip">
            <input type="checkbox" [checked]="statutsFiltres().has(statut)" (change)="toggle(statut)" />
            {{ statut }}
          </label>
        }
      </div>
      <button pButton (click)="reinisialise()" size="small" severity="secondary" text>
        <i class="pi pi-refresh" aria-hidden="true"></i>
        Réinitialiser
      </button>
    </div>

    <div class="assurlite-table-wrapper">
      <p-table [value]="contratsFiltres()" [stripedRows]="true" [rowHover]="true">
        <ng-template #header>
          <tr>
            <th>Type</th>
            <th>Prime</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </ng-template>

        <ng-template #body let-contrat>
          <tr app-contrat-ligne [contrat]="contrat" (supprimer)="supprimerContrat($event)"></tr>
        </ng-template>

        <ng-template #emptymessage>
          <tr>
            <td colspan="4" class="assurlite-empty-row">Aucun contrat</td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <div class="assurlite-footer">
      @if (contrats().length > 0) {
        <p class="assurlite-total">
          Total des primes
          <strong>{{ primeTotale() }} €</strong>
        </p>
      } @else {
        <p class="assurlite-total">Aucun contrat à afficher</p>
      }
      <button pButton (click)="ajoutContrat()" size="small">
        <i class="pi pi-plus" aria-hidden="true"></i>
        Ajouter un contrat
      </button>
    </div>
  </p-card>
</div>
