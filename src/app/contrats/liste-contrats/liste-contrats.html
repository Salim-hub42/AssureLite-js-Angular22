<div class="flex flex-column gap-3 contrats-table-wrapper">
  <h1>Listes des Contrats</h1>
  <p-table [value]="contrats()">
    <ng-template #header>
      <tr>
        <th>Type</th>
        <th>Prime</th>
        <th>Statut</th>
        <th>Supprimer</th>
      </tr>
    </ng-template>

    <ng-template #body let-contrat>
          <tr app-contrat-ligne [contrat]="contrat" (supprimer)="supprimerContrat($event)"></tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">Aucun contrat</td>
      </tr>
    </ng-template>
  </p-table>
  <div class="flex justify-content-between align-items-center">
    @if (contrats().length > 0) {
      <p>Total des primes : {{ primeTotale() }} €</p>
    } @else {
      <p>Aucun contrat à afficher</p>
    }
    <button pButton (click)="ajoutContrat()" size="small">Ajouter un Contrat</button>
  </div>
</div>
